name: Codex - pull request review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Ludvert1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      feedback: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Review PR
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt: |
            Review the current pull request against its base branch.
            Focus on correctness, authentication, Firebase security rules,
            Vercel API compatibility, Stripe billing, mobile portability,
            test coverage, and accidental credential disclosure.
            Do not change files. Report concrete findings with file paths.
  feedback:
    needs: review
    if: needs.review.outputs.feedback != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          CODEX_FEEDBACK: ${{ needs.review.outputs.feedback }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.CODEX_FEEDBACK.slice(0, 60000)
            });
