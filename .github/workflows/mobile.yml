name: Mobile builds
on: { workflow_dispatch: {} }
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - name: Build release bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease
      - name: Sign bundle (needs secrets)
        working-directory: .
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}", PW: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}", AL: "${{ secrets.ANDROID_KEY_ALIAS }}" }
        run: |
          if [ -z "$KS" ]; then echo "No keystore secret - skipping signing"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.jks"
          jarsigner -keystore "$RUNNER_TEMP/ks.jks" -storepass "$PW" mobile/android/app/build/outputs/bundle/release/app-release.aab "$AL"
      - uses: actions/upload-artifact@v4
        with: { name: android-aab, path: mobile/android/app/build/outputs/bundle/release/*.aab }
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios || true
      - run: npx cap sync ios
      - uses: actions/upload-artifact@v4
        with: { name: ios-project, path: mobile/ios }
